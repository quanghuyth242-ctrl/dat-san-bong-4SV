<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Chi tiết sân bóng đá trên 4SV.vn: giá thuê, giờ mở cửa, số sân, bản đồ, lịch trống và đánh giá của khách hàng."
    />
    <title>Chi tiết sân · 4SV.vn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Lexend:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="site-header">
      <div class="container">
        <nav class="nav-inner">
          <a class="nav-brand" href="../">
            <img data-site-logo alt="" hidden class="nav-brand-logo" />
            <span data-site-name>4SV.vn</span>
          </a>

          <button
            type="button"
            class="nav-toggle"
            id="navToggle"
            aria-label="Mở menu"
            aria-expanded="false"
          >
            <i class="fa-solid fa-bars"></i>
          </button>

          <div class="nav-menu" id="navMenu">
            <ul class="nav-links">
              <li><a class="nav-link" href="../#tim-san"><i class="fa-solid fa-magnifying-glass"></i> Tìm sân</a></li>
              <li><a class="nav-link" href="../#san-noi-bat">Sân nổi bật</a></li>
              <li><a class="nav-link" href="../#ban-do"><i class="fa-solid fa-map-location-dot"></i> Bản đồ</a></li>
            </ul>

            <div class="nav-actions">
              <a href="auth.html#login" class="nav-link"
                ><i class="fa-solid fa-right-to-bracket"></i> Đăng nhập</a
              >
              <a href="auth.html#register" class="nav-link nav-register">Đăng ký</a>
              <a href="../" class="btn-cta"><i class="fa-solid fa-house"></i> Trang chủ</a>
            </div>
          </div>
        </nav>
      </div>
    </header>

    <main class="pay-page">
      <div class="container">
        <!-- Đường dẫn trang, được chi-tiet.js bổ sung tên sân -->
        <nav class="pay-crumbs" id="dtCrumbs">
          <a href="../"><i class="fa-solid fa-house"></i> Trang chủ</a>
          <i class="fa-solid fa-angle-right"></i>
          <a href="../#san-noi-bat">Sân nổi bật</a>
          <i class="fa-solid fa-angle-right"></i>
          <span id="dtCrumbName">Chi tiết sân</span>
        </nav>

        <!-- Toàn bộ nội dung chi tiết được vẽ bởi chi-tiet.js -->
        <div id="detailRoot">
          <div class="pay-card pay-loading">
            <i class="fa-solid fa-spinner fa-spin"></i> Đang tải thông tin sân...
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© <span id="year"></span> 4SV.vn · Sân bóng đá giá rẻ cho mọi người.</p>
      </div>
    </footer>

    <!-- MODAL ĐẶT SÂN TRỰC TIÊP -->
    <div class="modal-overlay" id="bookModal" role="dialog" aria-modal="true" aria-label="Đặt sân">
      <div class="modal">
        <div class="modal-head">
          <h3><i class="fa-solid fa-calendar-check"></i> Đặt sân</h3>
          <button type="button" class="modal-close" aria-label="Đóng">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="modal-body" id="bookBody"></div>
      </div>
    </div>

    <script src="/vendor/leaflet/leaflet.js"></script>
    <script src="/project/js/store.js"></script>
    <!-- Form đặt sân dùng chung (modal "Đặt sân ngay" + dịch vụ đi kèm) -->
    <script src="/project/js/dat-san-modal.js"></script>
    <script type="module" src="./chi-tiet.js"></script>
  </body>
</html>
