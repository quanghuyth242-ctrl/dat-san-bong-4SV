<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Đánh giá và bình luận sân bóng đá - 4SV.vn" />
    <title>Đánh giá & Bình luận - 4SV.vn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      .rv-header {
        padding: clamp(80px, 10vw, 120px) 0 clamp(32px, 6vw, 56px);
        background: radial-gradient(1200px 500px at 50% 0%, rgba(139, 30, 30, 0.08), transparent);
      }
      .rv-card {
        background: #fff;
        border: 1px solid var(--grey-200);
        border-radius: 16px;
        padding: clamp(16px, 2vw, 20px);
        box-shadow: 0 10px 40px -24px rgba(15, 23, 42, 0.25);
      }
      .rv-stars {
        display: flex;
        gap: 4px;
        font-size: clamp(18px, 2vw, 22px);
        color: #facc15;
      }
      .rv-stars i.is-off {
        color: var(--grey-300);
      }
      .rv-list {
        display: flex;
        flex-direction: column;
        gap: clamp(12px, 2vw, 16px);
      }
      .rv-empty {
        text-align: center;
        color: var(--grey-500);
        padding: 40px 0;
      }
      .rv-form {
        display: flex;
        flex-direction: column;
        gap: clamp(12px, 2vw, 16px);
      }
      .rv-select,
      .rv-textarea {
        width: 100%;
        border: 1px solid var(--grey-200);
        border-radius: 12px;
        padding: 10px 12px;
        font: inherit;
        background: #fff;
      }
      .rv-textarea {
        min-height: 90px;
        resize: vertical;
      }
      .rv-actions {
        display: flex;
        justify-content: flex-end;
      }
      .rv-login-note {
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(37, 99, 235, 0.08);
        color: var(--primary-dark);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a href="/" class="brand">
          <span class="brand-mark"><i class="fa-solid fa-futbol"></i></span>
          <span class="brand-text">4<em>SV</em>.com</span>
        </a>
        <nav class="nav-links" id="navMenu">
          <a href="/index.html">Trang chủ</a>
          <a href="/index.html#tim-san">Tìm sân</a>
          <a href="danh-gia-khach.html" class="active">Đánh giá & Bình luận</a>
          <a href="src/auth.html#profile" data-auth="user" hidden>Tài khoản</a>
          <a href="src/auth.html" data-auth="login">Đăng nhập</a>
          <a href="src/auth.html#register" data-auth="register">Đăng ký</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="rv-header">
        <div class="container">
          <h1 class="section-title">Đánh giá &amp; Bình luận</h1>
          <p class="section-sub">Chia sẻ trải nghiệm của bạn sau khi đặt sân tại 4SV.vn</p>
        </div>
      </section>

      <section class="section-pad">
        <div class="container">
          <div class="rv-card">
            <h3 style="margin: 0 0 12px; font-size: clamp(1rem, 2vw, 1.1rem)">Viết đánh giá của bạn</h3>
            <form class="rv-form" id="rvForm" novalidate>
              <select class="rv-select" id="rvField" required>
                <option value="">-- Chọn sân --</option>
              </select>
              <div class="rv-stars" id="rvStars">
                <i data-star="1" class="fa-solid fa-star is-off"></i>
                <i data-star="2" class="fa-solid fa-star is-off"></i>
                <i data-star="3" class="fa-solid fa-star is-off"></i>
                <i data-star="4" class="fa-solid fa-star is-off"></i>
                <i data-star="5" class="fa-solid fa-star is-off"></i>
              </div>
              <textarea
                class="rv-textarea"
                id="rvComment"
                placeholder="Chia sẻ cảm nhận của bạn về chất lượng sân, dịch vụ..."
                required
              ></textarea>
              <div class="rv-login-note" id="rvLoginNote" hidden>
                Vui lòng <a href="src/auth.html">đăng nhập</a> để viết đánh giá
              </div>
              <div class="rv-actions">
                <button type="submit" class="btn-book" id="rvSubmit">
                  <i class="fa-solid fa-paper-plane"></i> Gửi đánh giá
                </button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <section class="section-pad section-grey">
        <div class="container">
          <h2 class="section-title-sm">Đánh giá từ khách hàng</h2>
          <div class="rv-list" id="rvList"></div>
          <div class="rv-empty" id="rvEmpty" hidden>Chưa có đánh giá nào</div>
        </div>
      </section>
    </main>

    <script src="/project/js/store.js"></script>
    <script type="module">
      const starsEl = document.getElementById('rvStars')
      const fieldSel = document.getElementById('rvField')
      const commentEl = document.getElementById('rvComment')
      const form = document.getElementById('rvForm')
      const listEl = document.getElementById('rvList')
      const emptyEl = document.getElementById('rvEmpty')
      const loginNote = document.getElementById('rvLoginNote')
      const submitBtn = document.getElementById('rvSubmit')
      let rating = 0

      function esc(v) {
        return String(v || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
      }

      function renderStars() {
        starsEl.querySelectorAll('i').forEach((i) => {
          const s = Number(i.dataset.star)
          i.classList.toggle('is-off', s > rating)
        })
      }

      starsEl.querySelectorAll('i').forEach((i) => {
        i.addEventListener('click', () => {
          rating = Number(i.dataset.star)
          renderStars()
        })
        i.addEventListener('mouseenter', () => {
          const s = Number(i.dataset.star)
          starsEl.querySelectorAll('i').forEach((x) => {
            const xs = Number(x.dataset.star)
            x.classList.toggle('is-off', xs > s)
          })
        })
      })
      starsEl.addEventListener('mouseleave', renderStars)

      function fillFields() {
        const f = SV.fields?.() || []
        fieldSel.innerHTML = '<option value="">-- Chọn sân --</option>'
        f.filter((x) => x.status === 'active').forEach((x) => {
          const o = document.createElement('option')
          o.value = x.id
          o.textContent = x.name
          fieldSel.appendChild(o)
        })
      }

      function starsHtml(r) {
        return Array.from({ length: 5 })
          .map((_, i) => `<i class="fa-solid fa-star${i < r ? '' : ' is-off'}"></i>`)
          .join('')
      }

      function renderList() {
        const reviews = SV.visibleReviews?.() || SV.reviews?.() || []
        listEl.innerHTML = ''
        if (!reviews.length) {
          emptyEl.hidden = false
          return
        }
        emptyEl.hidden = true
        reviews
          .slice()
          .reverse()
          .forEach((r) => {
            const el = document.createElement('article')
            el.className = 'rv-card'
            el.innerHTML = `
              <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
                <div style="display:flex;align-items:center;gap:10px">
                  <strong>${esc(r.userName || 'Người dùng')}</strong>
                  <span class="rv-stars">${starsHtml(r.rating || 0)}</span>
                </div>
                <small style="color:var(--grey-500)">${esc(r.date || '')}</small>
              </div>
              <p style="margin:10px 0 0;color:var(--grey-700);white-space:pre-wrap">${esc(r.comment || '')}</p>
              ${r.fieldName ? `<small style="color:var(--grey-500)">Sân: ${esc(r.fieldName)}</small>` : ''}
            `
            listEl.appendChild(el)
          })
      }

      function syncAuth() {
        const u = SV.currentUser?.()
        const logged = !!u
        loginNote.hidden = logged
        submitBtn.disabled = !logged
        if (u) {
          document.querySelectorAll('[data-auth="user"]').forEach((x) => (x.hidden = false))
          document.querySelectorAll('[data-auth="login"], [data-auth="register"]').forEach((x) => (x.hidden = true))
        } else {
          document.querySelectorAll('[data-auth="user"]').forEach((x) => (x.hidden = true))
          document.querySelectorAll('[data-auth="login"], [data-auth="register"]').forEach((x) => (x.hidden = false))
        }
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault()
        const u = SV.currentUser?.()
        if (!u) {
          loginNote.hidden = false
          return
        }
        if (!fieldSel.value) {
          alert('Vui lòng chọn sân')
          return
        }
        if (rating < 1) {
          alert('Vui lòng chọn số sao')
          return
        }
        const comment = commentEl.value.trim()
        if (!comment) {
          alert('Vui lòng nhập bình luận')
          return
        }
        const f = SV.fields?.().find((x) => String(x.id) === String(fieldSel.value))
        const ok = SV.addReview?.({
          fieldId: fieldSel.value,
          fieldName: f?.name || '',
          rating,
          comment,
          userId: u.id,
          userName: u.name || u.email || 'Người dùng',
          userAvatar: u.avatar || '',
          status: 'approved',
          date: new Date().toISOString().slice(0, 10),
        })
        if (ok) {
          commentEl.value = ''
          rating = 0
          renderStars()
          renderList()
          alert('Gửi đánh giá thành công!')
        } else {
          alert('Không thể gửi đánh giá')
        }
      })

      SV.on?.((k) => {
        if (k === 'reviews' || k === '*' || k === 'auth' || k === 'fields') {
          fillFields()
          renderList()
          syncAuth()
        }
      })

      fillFields()
      renderList()
      syncAuth()
    </script>
  </body>
</html>
