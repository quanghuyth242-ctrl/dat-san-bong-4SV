<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quản lý người dùng - Xem, khóa, mở khóa tài khoản">
  <title>Quản lý người dùng - Quản Lý Đặt Sân Bóng Đá</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body data-page="users">

  <div class="admin-layout">
    <div class="sidebar-overlay"></div>

    
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">⚽</div>
        <div class="brand-text">QUẢN LÝ ĐẶT SÂN BÓNG ĐÁ</div>
      </div>
      <nav class="sidebar-nav">
        <ul>
          <li class="nav-item"><a href="dashboard.html" class="nav-link"><span class="nav-icon">📊</span><span>Dashboard</span></a></li>
          <li class="nav-item"><a href="san-bong.html" class="nav-link"><span class="nav-icon">🏟️</span><span>Quản lý sân</span></a></li>
          <li class="nav-item"><a href="don-dat.html" class="nav-link"><span class="nav-icon">📋</span><span>Quản lý đơn đặt</span></a></li>
          <li class="nav-item"><a href="nguoi-dung.html" class="nav-link active"><span class="nav-icon">👥</span><span>Quản lý người dùng</span></a></li>
          <li class="nav-item"><a href="giao-dien.html" class="nav-link"><span class="nav-icon">🎨</span><span>Giao diện Admin</span></a></li>
          <li class="nav-item"><a href="xu-ly-admin.html" class="nav-link"><span class="nav-icon">⚙️</span><span>Xử lý Admin</span></a></li>
        </ul>
      </nav>
    </aside>

    
    <div class="main-content">
      <header class="header">
        <div class="header-left">
          <button class="btn-menu-toggle" aria-label="Toggle menu">☰</button>
          <h1 class="page-title">Quản lý người dùng</h1>
        </div>
        <div class="header-right">
          <div class="admin-info">
            <span>Admin</span>
            <div class="admin-avatar">A</div>
          </div>
        </div>
      </header>

      <div class="page-content">
        
        <div class="toolbar">
          <div class="toolbar-left">
            <div class="search-box">
              <span class="search-icon">🔍</span>
              <input type="text" id="searchUser" placeholder="Tìm theo tên, email, SĐT...">
            </div>
          </div>
        </div>

        
        <div class="card">
          <div class="card-body" style="padding: 0;">
            <div class="table-responsive">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Họ tên</th>
                    <th>Email</th>
                    <th>Số điện thoại</th>
                    <th>Số đơn đã đặt</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                  </tr>
                </thead>
                <tbody id="usersTableBody">
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  
  <div class="modal-overlay" id="userDetailModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Thông tin người dùng</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="userDetailBody">
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline modal-close">Đóng</button>
      </div>
    </div>
  </div>

  <script src="../js/admin.js"></script>
</body>
</html>
