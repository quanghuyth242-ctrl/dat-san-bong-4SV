<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chuyển hướng chi tiết sân - 4SV.vn</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Be Vietnam Pro', system-ui, sans-serif;
        background: #f1f5f9;
        color: #0f172a;
      }
      .box {
        max-width: 420px;
        padding: 28px 24px;
        text-align: center;
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
      }
      h1 {
        font-size: 1.15rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 16px;
        color: #475569;
        font-size: 0.95rem;
      }
      a {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 10px;
        background: #0284c7;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Trang chi tiết sân đã chuyển</h1>
      <p>
        Trang chi tiết sân bây giờ nằm ở <code>src/chi-tiet.html</code>. Đang
        chuyển hướng bạn tới trang mới…
      </p>
      <a id="goLink" href="../../src/chi-tiet.html">Đi tới trang chi tiết sân</a>
    </div>
    <script>
      // Trang cũ (FAG) bị bỏ: điều hướng về trang chi tiết đang dùng, giữ nguyên id sân.
      var id = new URLSearchParams(location.search).get('id')
      var target = '../../src/chi-tiet.html' + (id ? '?id=' + encodeURIComponent(id) : '')
      document.getElementById('goLink').setAttribute('href', target)
      location.replace(target)
    </script>
  </body>
</html>
